version: 2

project_name: atak

before:
  hooks:
    - go mod tidy

builds:
  - id: linux
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    binary: atak-linux

  - id: windows
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    binary: atak-windows

archives:
  - id: linux
    builds: [linux]
    format: tar.gz
    name_template: "atak-{{.Version}}-linux-x64"
    files:
      - README.md
      - SPEC.md
      - THIRD_PARTY_LICENSES.txt

  - id: windows
    builds: [windows]
    format: zip
    name_template: "atak-{{.Version}}-windows-x64"
    files:
      - README.md
      - SPEC.md
      - THIRD_PARTY_LICENSES.txt

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: noisethanks
    name: atak
  draft: true
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Version}}"
  header: |
    ## atak {{.Version}}

    A texture compression and backup utility for STALKER GAMMA modlists.

    ### Download
    - **Linux:** `atak-{{.Version}}-linux-x64.tar.gz`
    - **Windows:** `atak-{{.Version}}-windows-x64.zip`

    ### Installation
    **Linux:**
    ```bash
    tar -xzf atak-{{.Version}}-linux-x64.tar.gz
    chmod +x atak-linux
    ./atak-linux
    ```
    **Windows:** Extract the zip and run `atak-windows.exe`

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
