version: 2

project_name: atak

before:
  hooks:
    - go mod tidy

builds:
  - id: linux
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    binary: atak-linux

  - id: windows
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    binary: atak-windows

  - id: macos-amd64
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    binary: atak-macos

  - id: macos-arm64
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    binary: atak-macos

archives:
  - id: linux
    builds: [linux]
    format: tar.gz
    name_template: "atak-{{.Version}}-linux-x64"
    files:
      - README.md
      - SPEC.md
      - THIRD_PARTY_LICENSES.txt

  - id: windows
    builds: [windows]
    format: zip
    name_template: "atak-{{.Version}}-windows-x64"
    files:
      - README.md
      - SPEC.md
      - THIRD_PARTY_LICENSES.txt

  - id: macos-amd64
    builds: [macos-amd64]
    format: tar.gz
    name_template: "atak-{{.Version}}-macos-x64"
    files:
      - README.md
      - SPEC.md
      - THIRD_PARTY_LICENSES.txt

  - id: macos-arm64
    builds: [macos-arm64]
    format: tar.gz
    name_template: "atak-{{.Version}}-macos-arm64"
    files:
      - README.md
      - SPEC.md
      - THIRD_PARTY_LICENSES.txt

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: noisethanks
    name: atak
  draft: true
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Version}}"
  header: |
    ## atak {{.Version}}

    A texture compression and backup utility for STALKER GAMMA modlists.

    ### Download
    - **Linux:** `atak-{{.Version}}-linux-x64.tar.gz`
    - **Windows:** `atak-{{.Version}}-windows-x64.zip`
    - **macOS (Apple Silicon):** `atak-{{.Version}}-macos-arm64.tar.gz` — native, uses the CPU-accelerated compressonator-bc7e backend by default
    - **macOS (Intel):** `atak-{{.Version}}-macos-x64.tar.gz` — uses texconv by default (compressonator-bc7e-macos-arm64 is Apple Silicon only)

    ### Installation
    **Linux / macOS:**
    ```bash
    tar -xzf atak-{{.Version}}-linux-x64.tar.gz  # or macos-x64 / macos-arm64
    chmod +x atak-linux  # or atak-macos
    ./atak-linux         # or ./atak-macos
    ```
    **Windows:** Extract the zip and run `atak-windows.exe`

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
